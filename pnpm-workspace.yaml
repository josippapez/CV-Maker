# Supply-chain settings, see https://pnpm.io/supply-chain-security

# Only install versions published at least a day ago. Setting it explicitly
# also turns on minimumReleaseAgeStrict.
minimumReleaseAge: 1440
# Our own packages can be installed as soon as they are published.
minimumReleaseAgeExclude:
  - '@rawwee/*'

# Fail if a package's publish trust level drops compared to earlier releases.
trustPolicy: no-downgrade
# Only check versions published in the last 30 days. The lockfile pins many
# older releases that predate their package's provenance.
trustPolicyIgnoreAfter: 43200

# Fail the install when a dependency has a build script that is not listed
# in allowBuilds.
strictDepBuilds: true

# Transitive dependencies must come from the registry, not git or tarball URLs.
blockExoticSubdeps: true

allowBuilds:
  # Prints a warning when protobufjs versions mismatch. Not needed.
  protobufjs: false
  # Optional native regex engine for firebase-tools' hosting emulator.
  re2: false
